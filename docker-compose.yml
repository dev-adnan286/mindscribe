services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mindscribe-db
    environment:
      POSTGRES_USER: mindscribe
      POSTGRES_PASSWORD: mindscribe
      POSTGRES_DB: mindscribe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindscribe -d mindscribe"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mindscribe-api
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://mindscribe:mindscribe@db:5432/mindscribe
      SECRET_KEY: ${SECRET_KEY:-docker-compose-dev-secret-change-me-please}
      CORS_ORIGINS: http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: mindscribe-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
